[general]
default_session = "default"
target_integration_branch = "develop"
create_develop_if_missing = true
disallow_hard_reset = true

[worktree]
base_directory = ".herdr-worktrees"
naming_template = "herdm/{job_name}-{timestamp}"
auto_clean_on_success = true

[models.default_squad]
scout = "agy:gemini-3.8-flash-high"
architect = "pi:openai-codex/gpt-6.1-sol:high"
reviewer = "agy:gemini-4-argon-high:high"

[models.worker_pool.worker-1]
binding = "claude:claude-3-opus"
description = "Senior dev - Very capable for complex, architectural & subtle tasks"

[models.worker_pool.worker-2]
binding = "agy:gemini-3.8-flash"
description = "Junior dev - Fast and cost-effective for easy, straightforward & boilerplate tasks"

[models.worker_pool.worker-3]
binding = "pi:xai/grok-4.7"
description = "Mid dev - General implementation, backend, APIs, refactoring"

[tui]
refresh_rate_ms = 250
theme = "dark"
stream_buffer_lines = 1000
