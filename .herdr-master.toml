[general]
default_session = "default"
target_integration_branch = "develop"
create_develop_if_missing = true
disallow_hard_reset = true

[worktree]
base_directory = ".herdr-worktrees"
naming_template = "herdm/{job_name}-{timestamp}"
auto_clean_on_success = true

# Model defaults are not stored in this file.
# The sole product squad is the catalog default in Herdr mode:
# Scout agy gemini-3.8-flash-medium at effort medium,
# Architect pi openai-codex/gpt-6.1-sol at thinking max,
# Reviewer pi xai/grok-4.7 at thinking high,
# and two workers (agy gemini-3.8-flash, pi xai/grok-4.7) with effort unset.
# Save an explicit override with save_squad_as_default or the cockpit Save Default
# action; that writes [models.default_squad] and [models.worker_pool].
# Absent model fields inherit the catalog. They are not a second default squad.

[tui]
refresh_rate_ms = 250
theme = "dark"
stream_buffer_lines = 1000
